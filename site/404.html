<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page introuvable — PadelConnect</title>
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230C6A57'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='white' font-family='Arial'%3EP%3C/text%3E%3C/svg%3E"
    />
    <!-- Sa seule présence fait répondre un VRAI 404 par Cloudflare Pages à toute URL inconnue (sinon
         repli « SPA » : l'accueil en 200). Servie à n'importe quelle profondeur (/a/b/c) → chemins
         ABSOLUS uniquement ; style inline (autorisé par la CSP de _headers), aucune ressource externe.
         Les réécritures de _redirects (/invite/*, /club/*, /.well-known/*) passent AVANT ce fichier. -->
    <style>
      body { margin: 0; background: #f4f1e8; color: #17241f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.5; }
      .wrap { max-width: 520px; margin: 14vh auto; padding: 24px 16px; text-align: center; }
      .badge { font-size: 56px; line-height: 1; }
      h1 { color: #0c6a57; font-size: 26px; margin: 16px 0 8px; }
      p { color: #5b6b63; font-size: 16px; margin: 0 0 6px; }
      .cta { display: inline-block; margin-top: 20px; padding: 14px 26px; border-radius: 999px; background: #0c6a57; color: #fff; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="badge" aria-hidden="true">🎾</div>
      <h1>Page introuvable</h1>
      <p>Cette adresse n'existe pas (ou plus). Vérifie le lien, ou repars de l'accueil.</p>
      <p lang="en">This page doesn't exist.</p>
      <a class="cta" href="/">Retour à l'accueil</a>
    </main>
  </body>
</html>
