# Déploiement AUTOMATIQUE de l'Espace Club / Espace opérateur sur le web.
# But : le site web (club.padelconnectci.com) reste TOUJOURS synchro avec le dernier
# code de l'app — même code, mêmes écrans, mêmes règles. À chaque push (donc à chaque
# build), on ré-exporte le web et on redéploie sur Cloudflare Pages. Plus de « re-déposer
# dist/ à la main ».
#
# Secrets à créer UNE fois dans GitHub (Settings → Secrets and variables → Actions) :
#   - CLOUDFLARE_API_TOKEN     (jeton Cloudflare avec la permission « Cloudflare Pages: Edit »)
#   - CLOUDFLARE_ACCOUNT_ID    (l'ID de compte Cloudflare)
# Rien de secret ne vit dans le dépôt : les jetons restent côté GitHub.

name: Déployer le web (Espace Club)

on:
  push:
    branches:
      - main
      - claude/padelconnect-v4-17-4zblgh
    # On ne redéploie que si du code qui change le web a bougé (évite les runs inutiles).
    paths:
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: {} # bouton « Run workflow » dans l'onglet Actions (déclenchement manuel)

# Un seul déploiement à la fois ; un nouveau push annule le précédent en cours.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          # wrangler@latest exige Node >= 22 (sinon « Wrangler requires at least Node.js
          # v22.0.0 » → déploiement en échec). On aligne le runner sur 22.
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Exporter le web (dossier dist/)
        run: npm run build:web

      # wrangler EXCLUT tout dossier `node_modules` : sans cette étape les polices d'icônes
      # (Ionicons…) ne sont pas envoyées → icônes en carrés vides sur tout le site.
      - name: Corriger les chemins de polices
        run: ./scripts/fix-web-assets.sh dist

      - name: Déployer sur Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler@latest pages deploy dist
          --project-name=padelconnect-club
          --branch=main
          --commit-dirty=true
